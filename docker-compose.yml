version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - DEBUG=${DEBUG:-False}
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./data:/app/data
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
